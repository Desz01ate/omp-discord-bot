services:
  omp-discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    image: omp-discord-bot:latest
    container_name: omp-discord-bot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - ALLOWED_USERS=${ALLOWED_USERS:-}
      - CREATE_PRIVATE_THREADS=${CREATE_PRIVATE_THREADS:-true}
      - WORKSPACE_ROOT=/workspace
      # LLM Provider & Gateway URLs / Keys
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # Notification & Hook credentials
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID:-}
    volumes:
      # Host workspace: Bind mounts host repositories to /workspace inside container
      - ${HOST_WORKSPACE_PATH:-./workspace}:/workspace
      # OMP & Pi agent configurations (auth, models, history, roles)
      - ${OMP_CONFIG_PATH:-~/.omp}:/root/.omp
      - ${PI_CONFIG_PATH:-~/.pi}:/root/.pi
      # OMX / Codex skills, prompts, and configurations
      - ${CODEX_CONFIG_PATH:-~/.codex}:/root/.codex:ro
      # Mise tool data and runtime binary cache (Go, Java, .NET, Rust, etc.)
      - ${HOST_MISE_DATA_PATH:-~/.cache/omp-discord-bot/mise}:/root/.local/share/mise
      # (Optional) User startup hook scripts executed on container start
      # - ${HOST_INIT_HOOKS_PATH:-./init.d}:/docker-entrypoint-init.d:ro
      # (Optional) Git config for author identity in OMP commits
      # - ${HOME}/.gitconfig:/root/.gitconfig:ro
